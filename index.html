function snd(){CL.snd=!CL.snd;if(CL.snd)beep();render()}
const CN=(o,t)=>({'Chờ xác nhận':['Đã xác nhận','Đã từ chối'],'Đã xác nhận':['Đang chuẩn bị','Đã hủy'],'Đang chuẩn bị':[o.mode==='ship'?'Đang giao':'Sẵn sàng nhận','Đã hủy'],'Đang giao':['Hoàn thành'],'Sẵn sàng nhận':['Hoàn thành']}[t]||[]);
async function mut(id,f){const ref=CL.db.doc('status/'+id);try{const l=await ref.acquire({holder:CL.uid,ttlMs:6000});if(!l.acquired)return toast('Nhân viên khác đang xử lý đơn này, thử lại sau vài giây.');const sn=await ref.get(),c=sn.exists&&sn.data().status?sn.data():{status:'Chờ xác nhận',pay:'Chưa thanh toán',hist:[],rev:0},r=f(c);if(typeof r==='string')return toast(r);await ref.set({...c,...r.p,rev:(c.rev||0)+1,hist:[...(c.hist||[]),{by:CL.name,at:Date.now(),t:r.t}]});toast('Đã cập nhật đơn '+id)}catch(x){toast('Lỗi cập nhật: '+(x.message||x))}}
function cact(id,to){const o=CL.ord[id],x={};if(to==='Đã xác nhận'){const m=+prompt('Thời gian chuẩn bị dự kiến (phút)?','15');if(!(m>0))return toast('Cần nhập số phút hợp lệ.');x.eta=m}
if(to==='Đã từ chối'||to==='Đã hủy'){const r=(prompt('Lý do (bắt buộc, khách sẽ thấy)?')||'').trim();if(!r)return toast('Cần nhập lý do.');x.reason=r}
mut(id,c=>CN(o,c.status).includes(to)?{p:{...x,status:to},t:c.status+' → '+to+(x.eta?' (dự kiến '+x.eta+' phút)':'')+(x.reason?': '+x.reason:'')}:'Đơn vừa được người khác cập nhật (hiện: '+c.status+'). Danh sách đã làm mới.')}
const cpay=id=>mut(id,c=>{const v=c.pay==='Đã thanh toán'?'Chưa thanh toán':'Đã thanh toán';return{p:{pay:v},t:'Thanh toán: '+v}});
A.cord=()=>{const q=CL.sq.toLowerCase(),l=Object.values(CL.ord).filter(o=>(!q||o.id.toLowerCase().includes(q)||(o.cphone||'').includes(q))&&(!CL.sf||stl(o)===CL.sf)).sort((a,b)=>b.date-a.date);
return`<div class="box row"><button class="btn sm ${CL.snd?'':'alt'}" onclick="snd()">${CL.snd?'Âm báo: đang bật':'Bật âm báo'}</button><span>Chờ xử lý: <b>${CL.pendN}</b></span><input id="cq" placeholder="Mã đơn / SĐT" aria-label="Tìm đơn" value="${e(CL.sq)}" oninput="CL.sq=this.value;rl('cq')"><select aria-label="Trạng thái" onchange="CL.sf=this.value;rl()"><option value="">Mọi trạng thái</option>${['Chờ xác nhận','Đã xác nhận','Đang chuẩn bị','Đang giao','Sẵn sàng nhận','Hoàn thành','Đã từ chối','Đã hủy'].map(t=>`<option ${CL.sf===t?'selected':''}>${t}</option>`).join('')}</select></div>`+(l.map(o=>{const c=CL.st[o.id]||{},t=stl(o);return`<details class="box" ${t==='Chờ xác nhận'?'open':''}><summary><b>${o.id}</b> · ${dt(o.date)} · ${vnd(o.total)} · <span class="tag ok">${t}</span><span class="tag">${c.pay||'Chưa thanh toán'}</span></summary><p>${e(o.name)} · ${e(o.cphone)} · ${o.mode==='ship'?'Giao: '+e(o.addr):'Nhận tại quán'}${o.note?' · Ghi chú: '+e(o.note):''}</p>${o.lines.map(x=>`<p>${x.q}× ${e(P(x.pid)?.n)} <span class="mu">${e(desc(x))}</span></p>`).join('')}<p>Tiền hàng ${vnd(o.sub)} · Giảm ${vnd(o.disc)}${o.code?' ('+e(o.code)+')':''} · Phí giao ${vnd(o.ship)} · <b>Tổng ${vnd(o.total)}</b></p><p>Thanh toán: ${o.pay}${c.eta?' · Dự kiến '+c.eta+' phút':''}${c.reason?' · Lý do: '+e(c.reason):''}</p><div class="row">${CN(o,t).map(n=>`<button class="btn sm ${/hủy|từ chối/.test(n)?'alt':''}" onclick="cact('${o.id}','${n}')">${n}</button>`).join('')}<button class="btn sm alt" onclick="cpay('${o.id}')">${c.pay==='Đã thanh toán'?'Đặt lại: chưa thanh toán':'Đánh dấu đã thanh toán'}</button></div><details><summary>Lịch sử xử lý</summary>${(c.hist||[]).map(h=>`<p class="mu">${dt(h.at)} · ${e(h.by)}: ${e(h.t)}</p>`).join('')||'<p class="mu">Chưa có.</p>'}</details></details>`}).join('')||'<p class="box">Chưa có đơn phù hợp.</p>')};
(async()=>{try{S=JSON.parse(localStorage.getItem(K))}catch(x){}if(!S||!S.products)await seed();render();cloud()})();
</script></body></html>
